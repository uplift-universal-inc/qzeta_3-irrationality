name = "QZeta3"
version = "0.1.0"
keywords = ["math", "number theory", "irrationality", "q-zeta", "Hankel determinants"]
defaultTargets = ["QZeta3"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true
linter.unusedSectionVars = true
linter.unusedSimpArgs = true
linter.unnecessarySimpa = true
linter.deprecated = true

[[lean_lib]]
name = "QZeta3"

# The comparator surface (Mathlib-only challenge + solution); not part of the default build.
[[lean_lib]]
name = "QZeta3Audit"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"
