version: v0.4
project:
  name: 'Irrationality of zeta_{1/p}(3): Lean formalisation of the moving-denominator Hankel argument'
  description: A Lean 4 / Mathlib formalization of the moving-denominator Hankel argument for irrationality
    of sum_{n>=1} n^2/(p^n-1), for every integer p>=2. The analytic determinant bound, coefficientwise
    content, leading coefficient, cyclotomic denominator clearing, nonvanishing, and sufficient finite-sieve
    growth bound prove the unchanged main target. Production proof placeholders are eliminated;
    the full library build and transitive solution axiom audit pass for all audited declarations.
    An elementary second proof uses Gaussian-binomial residue integrality and direct criterion assembly;
    its dependency audit verifies the alternate arithmetic branch.
  authors:
  - uplift-universal-inc
  responsible_maintainers:
  - uplift-universal-inc
  license: Apache-2.0
