  notes: The imported initial skeleton was recorded as generated by Claude on 11 October 2026. Subsequent
    implementation used OpenAI Codex agents. The full library and explicit-series solution build and pass
    the transitive axiom allowlist audit. All production proof placeholders have been
    replaced by proofs or sufficient proved substitutes. A successful build with sorry warnings alone
    would not establish completion. The independent challenge template is explicitly excluded from the
    solution dependency graph. The elementary second proof adds finite Gaussian arithmetic and direct
    criterion assembly. Its declaration-dependency audit requires the Gaussian branch and excludes the
    first irrationality theorem and original coefficient-content branch.
fidelity:
  divergences: The factorial determinant prefactor replaces the Hadamard sqrt(K) prefactor; only the sufficient
    lower bound on b_K is used. Appendix A exponents cApp are unchanged, but an elementary period-six
    sieve supplies the weaker sufficient cubic cost 107/192 instead of an unconditional claim of the sharper
    321/(64*pi^2) asymptotic. The resulting exact positive margin is 31/576. General-cost asymptotic lemmas
    drive Main.irrational_xi; retained sharp-cost wrappers have explicit hypotheses. Arithmetic content
    is encoded through rational denominator coprimality and finite truncations. The exact degree is proved,
    though only the upper bound is needed. The defining sum starts at n+1. The elementary second proof
    replaces general residue integrality by Gaussian monomial residues and finite linearity, then uses
    the shared truncation and determinant algebra. Its source cost 9/16 is obtained by weakening the
    stronger proved 107/192 bound, giving margin 7/144. It shares the determinant, real estimate, local
    cyclotomic clearing, nonvanishing, and supporting algebra; it is not a determinant-free or unrelated
    independent method. See CORRESPONDENCE.md.
