name: Finite certificates and manuscript
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  finite-certificates:
    name: Finite arithmetic and interval checks (not a formal proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: make check
      - run: make certificate
  paper:
    name: Compile manuscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra lmodern
      - run: make paper
